[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = []
solc_version = "0.8.24"
# BOT Chain's supported EVM version is not confirmed yet; paris avoids PUSH0 (Shanghai) to be safe.
evm_version = "paris"
optimizer = true
# low run count favours a small deploy; adds only about 280 gas per logWorkout
optimizer_runs = 200

[fuzz]
runs = 512
